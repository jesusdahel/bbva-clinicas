name: Actualizar cotizaciones BMV

on:
  schedule:
    # Cada 30 minutos durante la sesión de la BMV.
    # La bolsa opera de 8:30 a 15:00 hora de Ciudad de México, que es UTC-6 todo el año.
    # GitHub suele retrasar las corridas programadas entre 5 y 20 minutos: es normal.
    - cron: "*/30 14-21 * * 1-5"
  workflow_dispatch:        # permite dispararlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: precios
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Consultar precios
        run: python actualiza_precios.py

      - name: Publicar cotizaciones.csv
        run: |
          set -euo pipefail

          if [ ! -s cotizaciones.csv ]; then
            echo "::error::El script no dejó ningún archivo. No se publica nada."
            exit 1
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # git add va PRIMERO: un archivo que todavía no está en el repositorio es
          # untracked, y git diff no compara archivos untracked. Sin este orden, la
          # primera corrida sale por "sin cambios" y nunca crea el archivo.
          git add cotizaciones.csv

          if git diff --staged --quiet; then
            echo "Sin cambios en los precios."
            exit 0
          fi

          git commit -m "Cotizaciones BMV $(TZ=America/Mexico_City date '+%d/%m/%Y %H:%M')"

          # Si otra corrida o un commit tuyo llegaron primero, el push se rechaza.
          # Se reintenta reacomodando el commit encima de lo que ya esté en main.
          for intento in 1 2 3; do
            if git push; then
              echo "Publicado en el intento $intento."
              exit 0
            fi
            echo "Push rechazado. Reacomodando sobre origin/main..."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            sleep $((intento * 5))
          done

          echo "::error::No se pudo publicar después de tres intentos."
          exit 1
