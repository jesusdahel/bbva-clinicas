if git diff --quiet -- cotizaciones.csv; then
  echo "Sin cambios en los precios."
  exit 0
fi
```[cite: 1]

Para Git, un archivo nuevo que **aún no existe en el repositorio** es considerado *untracked* (no rastreado). Cuando Git ejecuta `git diff --quiet` sobre un archivo no rastreado, **no detecta cambios** y devuelve `0`, por lo que el script cree que no hubo cambios, ejecuta `exit 0` e interrumpe el proceso antes de hacer `git add` o `git commit`[cite: 1].

El orden correcto debe ser hacer `git add` **primero** (para que Git lo registre) y luego verificar si hay diferencias frente al repositorio.

